# Seeded Architecture Decision Records for this pack (phase 4, task 4.5).
# Rendered into docs/bible/DECISIONS.md by .shiftstone/init/seed-governance.js
# when the pack is composed into a workspace.
apiVersion: workspace/v1
kind: DecisionSeed
metadata:
  pack: rr8-supabase-cf
decisions:
  - id: "DEC-001"
    title: "React Router 8 (Framework Mode) Architecture"
    date: "2026-09-05"
    status: "Accepted"
    context: "Needed a modern, full-stack React framework with first-class server-side rendering, streaming, data loading, route-level middleware, and native Edge runtime compatibility."
    decision: "Adopt React Router 8 in framework mode (`@react-router/dev`), taking advantage of native `MiddlewareFunction` support, type-safe Context API, and automatic route type generation (`+types/`)."
    consequences: "Avoids complex server/client component boundaries from RSC; provides unified loaders, actions, and middleware per route module."
  - id: "DEC-002"
    title: "Route Middleware-First Auth with @supabase/ssr & getClaims()"
    date: "2026-09-05"
    status: "Accepted"
    context: "Need robust, secure server-side session validation without incurring unnecessary network roundtrips to Supabase Auth on every route request."
    decision: "Implement `supabaseMiddleware` running `await supabase.auth.getClaims()` to validate JWTs locally via JWKS, refresh cookies before downstream routes execute, and inject the client into React Router Context (`supabaseContext`)."
    consequences: "Fast local JWT validation; session cookies are always refreshed cleanly across SSR requests."
  - id: "DEC-003"
    title: "Edge-Native Cloudflare Workers Runtime"
    date: "2026-09-05"
    status: "Accepted"
    context: "Need global low-latency execution and cost-effective serverless deployment with scheduled task capabilities."
    decision: "Deploy {{PROJECT_NAME}} to Cloudflare Workers / Pages using `@cloudflare/vite-plugin` and `wrangler`."
    consequences: "Code runs in V8 isolates at the edge; requires Node compatibility flags (`nodejs_compat`) and avoidance of non-edge Node APIs."
  - id: "DEC-004"
    title: "Supabase 2025 API Keys Standard"
    date: "2026-09-05"
    status: "Accepted"
    context: "Supabase introduced new API key formats replacing legacy JWT-based anon and service_role keys."
    decision: "Adopt `SUPABASE_PUBLISHABLE_KEY` (`sb_publishable_...`) for browser and SSR, and `SUPABASE_SECRET_KEY` (`sb_secret_...`) for server-side admin operations."
    consequences: "Keys are transmitted via `apikey` headers rather than Bearer authorization headers; secret keys are blocked from browser contexts."
  - id: "DEC-005"
    title: "Tailwind CSS v4 Semantic Theme Tokens"
    date: "2026-09-05"
    status: "Accepted"
    context: "Need strict light/dark mode support and design consistency without hardcoded hex colors or raw gray Tailwind classes."
    decision: "Layer semantic theme utilities (`theme-bg-color`, `theme-fg-color`, `theme-fc-heading`, `theme-fc-base`, `theme-border-color`) over Tailwind CSS v4 `@theme` configuration and shadcn/ui components."
    consequences: "Zero color drift; light and dark modes toggle automatically and seamlessly."
  - id: "DEC-006"
    title: "Cloudflare R2 Object Storage via S3-Compatible API"
    date: "2026-09-05"
    status: "Accepted"
    context: "Need scalable file storage without egress fees."
    decision: "Utilize Cloudflare R2 interfaced via the AWS SDK S3 client (`@aws-sdk/client-s3`) using presigned upload/download URLs."
    consequences: "Zero egress fees, high performance, and standard S3 API compatibility."
  - id: "DEC-007"
    title: "Monorepo Subfolder Architecture"
    date: "2026-09-05"
    status: "Accepted"
    context: "Prevent AI coding agents from polluting the workspace root with mixed application code, documentation, and configuration files."
    decision: "Establish workspace root strictly for AI steering, documentation architecture (SSOT), and monorepo scripts (`pnpm-workspace.yaml`). All active application source code resides in `apps/web/`."
    consequences: "Clean separation of concerns; AI IDEs can manage documentation without risking app compilation drift."
  - id: "DEC-008"
    title: "Multi-Method Authentication Architecture with Centralized Config"
    date: "2026-09-06"
    status: "Accepted"
    context: "Different SaaS applications require different login experiences (Email+Password, Email OTP 6-digit codes, passwordless Magic Links, or Google OAuth). Hardcoding a single method reduces template flexibility."
    decision: "Centralize auth method selection in `app/lib/auth/config.ts` (`authConfig.methods`) supporting all 4 methods. Default to Email+Password (primary) and Email OTP (secondary) with modular components (`MethodSelector`, `PasswordForm`, `EmailOtpForm`, `GoogleButton`)."
    consequences: "Developers toggle auth methods via simple boolean flags without altering route logic or rewriting forms."
  - id: "DEC-009"
    title: "Graceful Degradation for Zero-Credential Environments"
    date: "2026-09-06"
    status: "Accepted"
    context: "Fresh template checkouts, public portfolio previews, or local initial setups often lack live Supabase or Cloudflare credentials, causing traditional SSR frameworks to throw fatal 500 crashes on startup."
    decision: "Implement graceful degradation in `app/middleware/supabase.ts`. If environment variables are absent, store `null` in `supabaseContext` and permit downstream routes to proceed. Public pages (`/`, `/about`, `/contact`, `/design-system`) render normally, while auth pages display informative configuration banners."
    consequences: "Smooth developer onboarding; zero startup crashes when cloning or reviewing the template."
