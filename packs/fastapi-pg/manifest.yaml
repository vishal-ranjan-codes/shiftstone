# packs/fastapi-pg — starter archetype placeholder (task 4.9).
# Valid manifest so `--archetype=fastapi-pg` composes; skills and bible
# overlays are authored later (blueprint section 5.3 journey 1).
apiVersion: workspace/v1
kind: StackArchetype
metadata:
  name: fastapi-pg
  displayName: FastAPI + PostgreSQL
  version: 0.1.0
  tier: starter
  tags: [python, fastapi, postgresql, api]
spec:
  languages: [python]
  runtimes: [uvicorn]
  frameworks: [fastapi]
  databases: [postgresql]
  testRunners: [pytest]
  deployTargets: [docker]
  folderLayout: monorepo
  defaultAppPath: apps/api
  packaging: uv
  variables:
    - name: "{{PRODUCT_IDENTITY}}"
      type: string
      default: "a FastAPI + PostgreSQL service"
      description: One-line product identity injected into .shiftstone/static-rules/product.md.
    - name: "{{STACK_IDENTITY}}"
      type: string
      default: "Python 3.12, FastAPI, PostgreSQL, Pydantic v2, pytest"
      description: Stack identity line injected into .shiftstone/static-rules/product.md.
composition:
  skills:
    include:
      - "python-patterns"
      - "sqlalchemy"
      - "alembic"
      - "pydantic"
      - "fastapi-routing"
      - "pytest"
      - "httpx"
      - "uvicorn-deployment"
    exclude: []
  scaffold_script: ./scaffold-script.js
hooks:
  pre_init: ./scaffold-script.js
compatibility:
  core_min_version: 2.0.0
  peer_packs: []
conflicts:
  with: []
