# Model routing policy (amendment B7) — advisory defaults with explicit
# per-loop overrides. Read by .shiftstone/context/model-routing.ts, loop specs
# (model.task_class) and the /verify workflow.
#
# OpEx rationale (Osmani 05 — intelligent model routing):
#   frontier models are for design, architecture and implementation, where a
#   wrong decision is expensive to unwind; fast models are for test generation,
#   review and CI monitoring, where volume is high and CI catches mistakes
#   cheaply. Routing wrong-tier work wastes money; routing right-tier work
#   wastes judgment. This file is ADVISORY — explicit per-loop overrides and
#   human model choices always win.

tiers:
  frontier:
    label: highest-capability model
    rationale: requirements, architecture, implementation — mistakes are costly
  fast:
    label: low-latency, low-cost model
    rationale: test-gen, review, monitoring — volume work, cheap to verify

task_classes:
  design: frontier
  implementation: frontier
  test_generation: fast
  review: fast
  monitoring: fast
  documentation: fast

defaults:
  task_class: implementation
  tier: frontier

loop_overrides:
  # Explicit per-loop override > spec-declared task_class > defaults.
  # new-feature-loop (implementation) and quality-flywheel-loop (monitoring)
  # declare their class in their specs and deliberately have no override;
  # these two demonstrate the override layer for loops that declare nothing.
  diagnose-loop: monitoring
  schema-sync-loop: monitoring
