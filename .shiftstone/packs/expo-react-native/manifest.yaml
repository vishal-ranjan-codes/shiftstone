# packs/expo-react-native — starter archetype (graduated to LOCK-B4 bar).
apiVersion: workspace/v1
kind: StackArchetype
metadata:
  name: expo-react-native
  displayName: Expo + React Native
  version: 1.0.0
  tier: starter
  tags: [typescript, expo, react-native, mobile]
spec:
  languages: [typescript]
  runtimes: [node]
  frameworks: [expo, react-native]
  testRunners: [jest]
  deployTargets: [eas]
  folderLayout: monorepo
  defaultAppPath: apps/mobile
  packaging: pnpm
  variables:
    - name: "{{PRODUCT_IDENTITY}}"
      type: string
      default: "an Expo + React Native mobile application"
      description: One-line product identity injected into .shiftstone/static-rules/product.md.
    - name: "{{STACK_IDENTITY}}"
      type: string
      default: "Expo (React Native), TypeScript strict, Expo Router, Jest"
      description: Stack identity line injected into .shiftstone/static-rules/product.md.
  workspace:
    rootScripts:
      dev: "pnpm -C {{APP_PATH}} dev"
      build: "pnpm -C {{APP_PATH}} build"
      test: "pnpm -C {{APP_PATH}} test"
      lint: "pnpm -C {{APP_PATH}} lint"
      typecheck: "pnpm -C {{APP_PATH}} typecheck"
composition:
  skills:
    include:
      - "expo-router"
      - "expo-notifications"
      - "expo-secure-store"
      - "react-native-testing"
    exclude: []
  scaffold_script: ./scaffold-script.js
hooks:
  pre_init: ./scaffold-script.js
compatibility:
  core_min_version: 2.0.0
  peer_packs: []
conflicts:
  with: []
