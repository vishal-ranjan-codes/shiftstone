# packs/go-chi-postgres — starter archetype (graduated to LOCK-B4 bar).
apiVersion: workspace/v1
kind: StackArchetype
metadata:
  name: go-chi-postgres
  displayName: Go + Chi + PostgreSQL
  version: 1.0.0
  tier: starter
  tags: [go, chi, postgresql, api]
spec:
  languages: [go]
  runtimes: [go]
  frameworks: [chi]
  databases: [postgresql]
  testRunners: [go-test]
  deployTargets: [docker]
  folderLayout: monorepo
  defaultAppPath: apps/api-go
  packaging: go
  variables:
    - name: "{{PRODUCT_IDENTITY}}"
      type: string
      default: "a Go + Chi + PostgreSQL service"
      description: One-line product identity injected into .shiftstone/static-rules/product.md.
    - name: "{{STACK_IDENTITY}}"
      type: string
      default: "Go 1.23, chi router, pgx, PostgreSQL, go test"
      description: Stack identity line injected into .shiftstone/static-rules/product.md.
  workspace:
    rootScripts:
      dev: "cd {{APP_PATH}} && go run ./cmd/api"
      test: "cd {{APP_PATH}} && go test ./..."
      lint: "cd {{APP_PATH}} && golangci-lint run"
      build: "cd {{APP_PATH}} && go build -o bin/api ./cmd/api"
composition:
  skills:
    include:
      - "chi-routing"
      - "go-postgres"
      - "go-migrations"
      - "go-testing"
    exclude: []
  scaffold_script: ./scaffold-script.js
hooks:
  pre_init: ./scaffold-script.js
compatibility:
  core_min_version: 2.0.0
  peer_packs: []
conflicts:
  with: []
