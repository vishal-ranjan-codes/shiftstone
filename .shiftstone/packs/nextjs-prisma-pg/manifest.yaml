# packs/nextjs-prisma-pg — starter archetype (graduated to LOCK-B4 bar).
apiVersion: workspace/v1
kind: StackArchetype
metadata:
  name: nextjs-prisma-pg
  displayName: Next.js + Prisma + PostgreSQL
  version: 1.0.0
  tier: starter
  tags: [typescript, nextjs, prisma, postgresql]
spec:
  languages: [typescript]
  runtimes: [node]
  frameworks: [nextjs, prisma]
  databases: [postgresql]
  testRunners: [vitest]
  folderLayout: monorepo
  defaultAppPath: apps/web
  packaging: pnpm
  variables:
    - name: "{{PRODUCT_IDENTITY}}"
      type: string
      default: "a Next.js + Prisma SaaS application"
      description: One-line product identity injected into .shiftstone/static-rules/product.md.
    - name: "{{STACK_IDENTITY}}"
      type: string
      default: "Next.js (App Router), Prisma ORM, PostgreSQL, TypeScript strict, Tailwind CSS v4"
      description: Stack identity line injected into .shiftstone/static-rules/product.md.
  workspace:
    rootScripts:
      dev: "pnpm -C {{APP_PATH}} dev"
      build: "pnpm -C {{APP_PATH}} build"
      start: "pnpm -C {{APP_PATH}} start"
      test: "pnpm -C {{APP_PATH}} test"
      lint: "pnpm -C {{APP_PATH}} lint"
      typecheck: "pnpm -C {{APP_PATH}} typecheck"
      "db:migrate": "pnpm -C {{APP_PATH}} db:migrate"
      "db:generate": "pnpm -C {{APP_PATH}} db:generate"
composition:
  skills:
    include:
      - "nextjs-app-router"
      - "nextjs-data-fetching"
      - "prisma-schema"
      - "prisma-migrations"
      - "server-actions"
      - "vitest-testing"
    exclude: []
  scaffold_script: ./scaffold-script.js
hooks:
  pre_init: ./scaffold-script.js
compatibility:
  core_min_version: 2.0.0
  peer_packs: []
conflicts:
  with:
    - rr8-supabase-cf
