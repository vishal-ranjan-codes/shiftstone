# packs/fastapi-pg — starter archetype (graduated to LOCK-B4 bar).
apiVersion: workspace/v1
kind: StackArchetype
metadata:
  name: fastapi-pg
  displayName: FastAPI + PostgreSQL
  version: 1.0.0
  tier: starter
  tags: [python, fastapi, postgresql, api]
spec:
  languages: [python]
  runtimes: [uvicorn]
  frameworks: [fastapi]
  databases: [postgresql]
  testRunners: [pytest]
  deployTargets: [docker]
  folderLayout: monorepo
  defaultAppPath: apps/api
  packaging: uv
  variables:
    - name: "{{PRODUCT_IDENTITY}}"
      type: string
      default: "a FastAPI + PostgreSQL service"
      description: One-line product identity injected into .shiftstone/static-rules/product.md.
    - name: "{{STACK_IDENTITY}}"
      type: string
      default: "Python 3.12, FastAPI, PostgreSQL, Pydantic v2, pytest"
      description: Stack identity line injected into .shiftstone/static-rules/product.md.
  workspace:
    rootScripts:
      dev: "uv run --directory {{APP_PATH}} uvicorn main:app --reload"
      test: "uv run --directory {{APP_PATH}} pytest"
      lint: "uv run --directory {{APP_PATH}} ruff check ."
      typecheck: "uv run --directory {{APP_PATH}} mypy ."
      build: "uv build --directory {{APP_PATH}}"
composition:
  skills:
    include:
      - "python-patterns"
      - "sqlalchemy"
      - "alembic"
      - "pydantic"
      - "fastapi-routing"
      - "pytest"
      - "httpx"
      - "uvicorn-deployment"
    exclude: []
  scaffold_script: ./scaffold-script.js
hooks:
  pre_init: ./scaffold-script.js
compatibility:
  core_min_version: 2.0.0
  peer_packs: []
conflicts:
  with: []
