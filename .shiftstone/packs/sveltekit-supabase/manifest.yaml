# packs/sveltekit-supabase — starter archetype (graduated to LOCK-B4 bar).
apiVersion: workspace/v1
kind: StackArchetype
metadata:
  name: sveltekit-supabase
  displayName: SvelteKit + Supabase
  version: 1.0.0
  tier: starter
  tags: [svelte, sveltekit, supabase, typescript]
spec:
  languages: [typescript]
  runtimes: [node]
  frameworks: [sveltekit, supabase-js]
  databases: [supabase-postgres]
  testRunners: [vitest]
  deployTargets: [cloudflare-workers]
  folderLayout: monorepo
  defaultAppPath: apps/web
  packaging: pnpm
  variables:
    - name: "{{PRODUCT_IDENTITY}}"
      type: string
      default: "a SvelteKit + Supabase application"
      description: One-line product identity injected into .shiftstone/static-rules/product.md.
    - name: "{{STACK_IDENTITY}}"
      type: string
      default: "SvelteKit, Supabase (PostgreSQL + Auth + RLS), TypeScript strict, Tailwind CSS v4"
      description: Stack identity line injected into .shiftstone/static-rules/product.md.
  workspace:
    rootScripts:
      dev: "pnpm -C {{APP_PATH}} dev"
      build: "pnpm -C {{APP_PATH}} build"
      start: "pnpm -C {{APP_PATH}} preview"
      test: "pnpm -C {{APP_PATH}} test"
      test:ui: "pnpm -C {{APP_PATH}} test:ui"
      lint: "pnpm -C {{APP_PATH}} lint"
      typecheck: "pnpm -C {{APP_PATH}} typecheck"
composition:
  skills:
    include:
      - "sveltekit-routing"
      - "sveltekit-forms"
      - "sveltekit-supabase"
      - "vitest-testing"
    exclude: []
  scaffold_script: ./scaffold-script.js
hooks:
  pre_init: ./scaffold-script.js
compatibility:
  core_min_version: 2.0.0
  peer_packs: []
conflicts:
  with:
    - rr8-supabase-cf
    - nextjs-prisma-pg
